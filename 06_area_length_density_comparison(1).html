<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>各区面积 / 道路总长 / 路网密度对比 (2026)</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #2c3e50;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .chart-wrap {
    background: #fff; border-radius: 12px; padding: 20px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%; max-width: 1100px;
  }
  .chart-title {
    font-size: 18px; font-weight: 600; color: #1e3c72;
    margin-bottom: 4px; text-align: center;
  }
  .chart-sub {
    font-size: 12px; color: #7a8a99; text-align: center; margin-bottom: 12px;
  }
  #chart { width: 100%; height: 520px; }
</style>
</head>
<body>
<div class="chart-wrap">
  <div class="chart-title">各区面积 / 道路总长 / 路网密度对比 (2026)</div>
  <div id="chart"></div>
</div>
<script>
  var chart = echarts.init(document.getElementById('chart'));
  var option = {
        tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'}},
        title: [
            {text: '面积 (km²)', left: '5%', top: 8, textAlign: 'center', textStyle: {fontSize: 13, color: '#2c3e50'}},
            {text: '道路总长 (km)', left: '38%', top: 8, textAlign: 'center', textStyle: {fontSize: 13, color: '#2c3e50'}},
            {text: '路网密度 (km/km²)', left: '71%', top: 8, textAlign: 'center', textStyle: {fontSize: 13, color: '#2c3e50'}}
        ],
        grid: [
            {left: '5%', right: '69%', top: 50, bottom: 65},
            {left: '38%', right: '36%', top: 50, bottom: 65},
            {left: '71%', right: '3%', top: 50, bottom: 65}
        ],
        xAxis: [
            {gridIndex: 0, type: 'category', data: ["福田区", "南山区", "罗湖区", "龙华区", "宝安区", "光明区", "坪山区", "盐田区", "龙岗区"], axisLabel: {fontSize: 10, rotate: 35, color: '#2c3e50'}, axisLine: {lineStyle: {color: '#bdc3c7'}}},
            {gridIndex: 1, type: 'category', data: ["福田区", "南山区", "罗湖区", "龙华区", "宝安区", "光明区", "坪山区", "盐田区", "龙岗区"], axisLabel: {fontSize: 10, rotate: 35, color: '#2c3e50'}, axisLine: {lineStyle: {color: '#bdc3c7'}}},
            {gridIndex: 2, type: 'category', data: ["福田区", "南山区", "罗湖区", "龙华区", "宝安区", "光明区", "坪山区", "盐田区", "龙岗区"], axisLabel: {fontSize: 10, rotate: 35, color: '#2c3e50'}, axisLine: {lineStyle: {color: '#bdc3c7'}}}
        ],
        yAxis: [
            {gridIndex: 0, type: 'value', axisLabel: {fontSize: 10, color: '#5a6c7d'}, splitLine: {lineStyle: {type: 'dashed', color: '#ecf0f1'}}},
            {gridIndex: 1, type: 'value', axisLabel: {fontSize: 10, color: '#5a6c7d'}, splitLine: {lineStyle: {type: 'dashed', color: '#ecf0f1'}}},
            {gridIndex: 2, type: 'value', axisLabel: {fontSize: 10, color: '#5a6c7d'}, splitLine: {lineStyle: {type: 'dashed', color: '#ecf0f1'}}}
        ],
        series: [
            {type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barWidth: '55%',
             data: [80.04, 205.01, 78.95, 177.3, 408.8, 156.19, 164.65, 89.0, 778.28],
             itemStyle: {color: '#3498db', borderRadius: [3,3,0,0]},
             label: {show: true, position: 'top', fontSize: 9, color: '#2c3e50', formatter: function(p){return p.value.toFixed(0);}}
            },
            {type: 'bar', xAxisIndex: 1, yAxisIndex: 1, barWidth: '55%',
             data: [1689.2, 3092.6, 1098.5, 2300.4, 4484.3, 1289.0, 1287.5, 676.5, 4823.1],
             itemStyle: {color: '#27ae60', borderRadius: [3,3,0,0]},
             label: {show: true, position: 'top', fontSize: 9, color: '#2c3e50', formatter: function(p){return p.value.toFixed(0);}}
            },
            {type: 'bar', xAxisIndex: 2, yAxisIndex: 2, barWidth: '55%',
             data: [{"value": 21.1, "itemStyle": {"color": "#c0392b", "borderRadius": [3,3,0,0]}},
             {"value": 15.09, "itemStyle": {"color": "#e67e22", "borderRadius": [3,3,0,0]}},
             {"value": 13.91, "itemStyle": {"color": "#e74c3c", "borderRadius": [3,3,0,0]}},
             {"value": 12.97, "itemStyle": {"color": "#f39c12", "borderRadius": [3,3,0,0]}},
             {"value": 10.97, "itemStyle": {"color": "#27ae60", "borderRadius": [3,3,0,0]}},
             {"value": 8.25, "itemStyle": {"color": "#2980b9", "borderRadius": [3,3,0,0]}},
             {"value": 7.82, "itemStyle": {"color": "#8e44ad", "borderRadius": [3,3,0,0]}},
             {"value": 7.6, "itemStyle": {"color": "#16a085", "borderRadius": [3,3,0,0]}},
             {"value": 6.2, "itemStyle": {"color": "#34495e", "borderRadius": [3,3,0,0]}}],
             label: {show: true, position: 'top', fontSize: 9, color: '#2c3e50', formatter: function(p){return p.value.toFixed(2);}}
            }
        ]
    };
  chart.setOption(option);
  window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
