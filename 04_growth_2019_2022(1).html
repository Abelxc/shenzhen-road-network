<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2019-2022年各区路网密度增量与涨幅双口径对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #2c3e50;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .chart-wrap {
    background: #fff; border-radius: 12px; padding: 20px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%; max-width: 1100px;
  }
  .chart-title {
    font-size: 18px; font-weight: 600; color: #1e3c72;
    margin-bottom: 4px; text-align: center;
  }
  .chart-sub {
    font-size: 12px; color: #7a8a99; text-align: center; margin-bottom: 12px;
  }
  #chart { width: 100%; height: 520px; }
</style>
</head>
<body>
<div class="chart-wrap">
  <div class="chart-title">2019-2022年各区路网密度增量与涨幅双口径对比</div>
  <div id="chart"></div>
</div>
<script>
  var chart = echarts.init(document.getElementById('chart'));
  var option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: {type: 'cross', crossStyle: {color: '#999'}},
            formatter: function(params) {
                var name = params[0].name;
                var inc = params[0].value;
                var pct = params.length > 1 ? params[1].value : 0;
                return '<b>' + name + '</b><br>' +
                    '绝对增量: <b>+' + inc + ' km/km²</b><br>' +
                    '相对涨幅: <b>+' + pct + '%</b>';
            }
        },
        legend: {
            data: ['绝对增量 (km/km²)', '相对涨幅 (%)'],
            top: 6, left: 'center', textStyle: {fontSize: 12}
        },
        grid: {left: 80, right: 80, top: 60, bottom: 70},
        xAxis: {
            type: 'category',
            data: ["福田区", "坪山区", "龙华区", "南山区", "光明区", "罗湖区", "宝安区", "龙岗区", "盐田区"],
            axisLabel: {fontSize: 12, color: '#2c3e50', rotate: 25},
            axisLine: {lineStyle: {color: '#bdc3c7'}}
        },
        yAxis: [
            {
                type: 'value',
                name: '绝对增量 (km/km²)',
                nameTextStyle: {color: '#7a8a99', fontSize: 12},
                axisLabel: {color: '#5a6c7d'},
                splitLine: {lineStyle: {type: 'dashed', color: '#ecf0f1'}}
            },
            {
                type: 'value',
                name: '相对涨幅 (%)',
                nameTextStyle: {color: '#e67e22', fontSize: 12},
                axisLabel: {color: '#e67e22', formatter: '{value}%'},
                splitLine: {show: false}
            }
        ],
        series: [
            {
                name: '绝对增量 (km/km²)',
                type: 'bar',
                barWidth: '45%',
                yAxisIndex: 0,
                label: {show: true, position: 'top', fontSize: 11, color: '#2c3e50', formatter: '+{c}'},
                data: [{"value": 3.62, "itemStyle": {"color": "#e74c3c", "borderRadius": [4, 4, 0, 0]}},
{"value": 2.82, "itemStyle": {"color": "#e74c3c", "borderRadius": [4, 4, 0, 0]}},
{"value": 2.53, "itemStyle": {"color": "#e74c3c", "borderRadius": [4, 4, 0, 0]}},
{"value": 2.39, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}},
{"value": 1.75, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}},
{"value": 1.56, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}},
{"value": 1.34, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}},
{"value": 1.2, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}},
{"value": 1.04, "itemStyle": {"color": "#90caf9", "borderRadius": [4, 4, 0, 0]}}]
            },
            {
                name: '相对涨幅 (%)',
                type: 'line',
                yAxisIndex: 1,
                symbol: 'circle',
                symbolSize: 10,
                lineStyle: {width: 3, color: '#e67e22'},
                itemStyle: {color: '#e67e22'},
                label: {show: true, position: 'top', fontSize: 11, color: '#e67e22', formatter: '{c}%'},
                data: [26.0, 73.6, 39.7, 23.1, 41.3, 16.9, 18.7, 33.7, 20.2]
            }
        ]
    };
  chart.setOption(option);
  window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
